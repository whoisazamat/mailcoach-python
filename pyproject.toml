[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mailcoach-python"
description = "A Python client for the Mailcoach API."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "whoisazamat" }]
keywords = ["mailcoach", "email", "newsletter", "api", "client"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Email",
    "Typing :: Typed",
]
dynamic = ["version"]
dependencies = ["requests>=2.33.0"]

[project.optional-dependencies]
dev = [
    "mypy==2.3.1",
    "pytest>=9.0.3",
    "pytest-cov==7.1.0",
    "requests-mock==1.12.1",
    "ruff==0.16.4",
    "types-requests==2.33.0.20260712",
]

[project.urls]
Homepage = "https://github.com/whoisazamat/mailcoach-python"
Issues = "https://github.com/whoisazamat/mailcoach-python/issues"
Changelog = "https://github.com/whoisazamat/mailcoach-python/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "mailcoach/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["mailcoach"]

[tool.hatch.build.targets.sdist]
include = ["mailcoach", "tests", "README.md", "CHANGELOG.md", "LICENSE", "pyproject.toml"]


[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov --cov-report=term-missing"

[tool.coverage.run]
source = ["mailcoach"]
branch = true

[tool.coverage.report]
fail_under = 100
show_missing = true


[tool.mypy]
python_version = "3.11"
files = ["mailcoach", "tests"]
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false


[tool.ruff]
line-length = 120
target-version = "py311"
cache-dir = "/tmp/ruff-cache/"
lint.select = ["ALL"]
lint.ignore = ["CPY001", "D100", "D104", "D105", "D107", "D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN", "D1", "PLR0913", "PLR0917", "PLR2004", "S101", "S106", "SLF001"]

[tool.ruff.lint.isort]
lines-after-imports = 2
no-lines-before = ["standard-library", "local-folder"]
known-first-party = ["mailcoach", "tests"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
